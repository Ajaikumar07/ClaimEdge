spring.application.name=claimedge

# ============================================================
# Database Configuration
# Update these values to match your local MySQL setup
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/claimedge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Server
# ============================================================
server.port=8010

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=claimedge-secret-key-claimedge-secret-key-123456
jwt.expiration=86400000
